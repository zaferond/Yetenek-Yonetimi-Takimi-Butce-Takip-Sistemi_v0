name: Verify
on: [push, pull_request]
jobs:
  local-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-check.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
